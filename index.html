<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <!-- ───── META ───── -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ───── TITLE ───── -->
  <title>Abheek Choudhury</title>

  <!-- ───── GOOGLE FONT ───── -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500&display=swap" rel="stylesheet">

  <!-- ───── GLOBAL STYLES ───── -->
  <style>
    /* ================= ROOT THEME VARIABLES ================= */
    :root {
      --bg: #000;
      --surface: #141414;
      --surface2: #1e1e1e;
      --border: rgba(255, 255, 255, 0.09);
      --border-h: rgba(255, 255, 255, 0.2);
      --text: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.55);
      --dim: rgba(245, 245, 247, 0.26);
      --accent: #2997ff;
      --nav-h: 52px;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ================= LIGHT THEME ================= */
    [data-theme="light"] {
      --bg: #fff;
      --surface: #f0f0f5;
      --surface2: #e2e2ea;
      --border: rgba(0, 0, 0, 0.08);
      --border-h: rgba(0, 0, 0, 0.18);
      --text: #1d1d1f;
      --muted: rgba(29, 29, 31, 0.56);
      --dim: rgba(29, 29, 31, 0.3);
      --accent: #0066cc;
    }

    /* ================= RESET ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s, color 0.4s;
    }

    /* ================= NAVBAR ================= */
    .nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 999;
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
    }

    .nav-bar {
      max-width: 1200px;
      margin: auto;
      height: var(--nav-h);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }

    /* ================= BUTTON RESET ================= */
    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* ================= LINKS ================= */
    a {
      text-decoration: none;
      color: inherit;
    }

    /* ================= HERO SECTION ================= */
    .hero-body {
      text-align: center;
      max-width: 760px;
      margin: auto;
    }

    /* ================= CARDS ================= */
    .card {
      background: var(--surface);
      border-radius: 18px;
      padding: 32px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    /* ================= CONTACT FORM ================= */
    .cf-input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }

  </style>
</head>

<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="nav">
    <div class="nav-bar">

      <!-- LOGO -->
      <span class="nav-logo" onclick="go('hero')">AC</span>

      <!-- NAV LINKS -->
      <div class="nav-links">
        <button onclick="go('projects')">Projects</button>
        <button onclick="go('skills')">Skills</button>
        <button onclick="go('contact')">Contact</button>
      </div>

      <!-- THEME TOGGLE -->
      <button onclick="toggleTheme()">☽</button>

    </div>
  </nav>

  <!-- ================= HERO ================= -->
  <section id="hero" class="view active">
    <div class="hero-body">
      <h1>Abheek Choudhury</h1>
      <p>Software Systems • Scientific Computing • Hardware Integration</p>
    </div>
  </section>

  <!-- ================= PROJECTS ================= -->
  <section id="projects" class="view">
    <div class="card">
      <h3>Plagiarism Detection</h3>
      <p>String matching + similarity scoring</p>
    </div>
  </section>

  <!-- ================= CONTACT ================= -->
  <section id="contact" class="view">
    <input class="cf-input" placeholder="Your Name" />
    <input class="cf-input" placeholder="Email" />
  </section>

  <!-- ================= SCRIPT ================= -->
  <script>

    /* ================= STATE ================= */
    let currentView = 'hero';

    /* ================= NAVIGATION ================= */
    function go(id) {
      document.getElementById(currentView).classList.remove('active');
      document.getElementById(id).classList.add('active');
      currentView = id;
    }

    /* ================= THEME ================= */
    function toggleTheme() {
      const theme = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute(
        'data-theme',
        theme === 'dark' ? 'light' : 'dark'
      );
    }

  </script>

</body>
</html>
